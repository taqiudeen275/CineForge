name: cineforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cineforge
      POSTGRES_PASSWORD: cineforge
      POSTGRES_DB: cineforge
    ports: ["5432:5432"]
    volumes: ["../../.data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineforge -d cineforge"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 25s

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ../../services/control-api/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://cineforge:cineforge@postgres:5432/cineforge?sslmode=disable", "up"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: cineforge
      POSTGRES_PWD: cineforge
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]

  fake-gcs:
    image: fsouza/fake-gcs-server:1.52.3
    command: ["-scheme", "http", "-port", "4443", "-backend", "filesystem", "-data", "/data"]
    ports: ["4443:4443"]
    volumes: ["../../.data/gcs:/data"]

  gcs-setup:
    image: curlimages/curl:8.12.1
    depends_on: [fake-gcs]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sleep 2;
        curl -fsS -X POST 'http://fake-gcs:4443/storage/v1/b?project=cineforge-local'
        -H 'Content-Type: application/json' -d '{"name":"cineforge-quarantine"}' || true;
        curl -fsS -X POST 'http://fake-gcs:4443/storage/v1/b?project=cineforge-local'
        -H 'Content-Type: application/json' -d '{"name":"cineforge-media"}' || true

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]

  firebase-emulator:
    build:
      context: ./firebase-emulator
    environment:
      GCLOUD_PROJECT: cineforge-local
      FIREBASE_PROJECT: cineforge-local
    ports: ["9099:9099", "4000:4000"]

  control-api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/control-api/Dockerfile
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_started }
    env_file: ../../.env
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://cineforge:cineforge@postgres:5432/cineforge?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      GCS_UPLOAD_ENDPOINT: http://fake-gcs:4443/upload/storage/v1
      MAIL_SMTP_ADDR: mailpit:1025
    ports: ["8080:8080"]

  media-worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: services/media-worker/Dockerfile
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_started }
      fake-gcs: { condition: service_started }
      clamav: { condition: service_healthy }
    env_file: ../../.env
    environment:
      DATABASE_URL: postgres://cineforge:cineforge@postgres:5432/cineforge?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      GCS_ENDPOINT: http://fake-gcs:4443/storage/v1/
      CLAMD_HOST: clamav:3310

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on: [control-api]
    environment:
      CONTROL_API_ORIGIN: http://control-api:8080
      NEXT_PUBLIC_FIREBASE_API_KEY: local-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: cineforge-local
    ports: ["3000:3000"]
